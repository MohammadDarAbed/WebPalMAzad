<ng-container *ngFor="let blade of blades$ | async">
  <div class="blade">
    <div class="blade-header">
      {{ blade.title }}
      <button (click)="closeBlade(blade.key)">✖</button>
    </div>

    <div class="blade-content">
      <ng-container *ngIf="blade.component">
        <ng-container *ngComponentOutlet="blade.component; injector: createInjectorOnce(blade)">
        </ng-container>
      </ng-container>
    </div>
  </div>
</ng-container>

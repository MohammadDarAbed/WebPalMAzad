<app-editable-grid
  *ngIf="gridModel.data.length"
  [config]="tableConfig"
  [model]="gridModel"
  [validators]="validators"
  (cellValueChanged)="onCellValueChanged($event)"
  (rowAdded)="onProductAdded($event)"
  (rowDeleted)="onProductDeleted($event)"
  (rowEdited)="onProductEdited($event)"
  (rowReordered)="onProductReordered($event)"
  (columnReordered)="onColumnReordered($event)"
  (editFormCreated)="onEditFormCreated($event)"
  >
</app-editable-grid>
